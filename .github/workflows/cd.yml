name: SevenZipSharp CD

on:
  workflow_dispatch:

env:
  CONFIGURATION: Release
  PLATFORM: x64
  OUTPUT_DIR: ${{ github.workspace }}\artifacts\nupkg

jobs:
  build-pack-publish:
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Pack the project
        run: >-
          dotnet pack SevenZip/SevenZip.csproj
          -c $env:CONFIGURATION
          -p:Platform=$env:PLATFORM
          --output $env:OUTPUT_DIR
          -p:GeneratePackageOnBuild=false

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet artifacts
          path: |
            ${{ env.OUTPUT_DIR }}\*.nupkg
            ${{ env.OUTPUT_DIR }}\*.snupkg
          if-no-files-found: error

      - name: Sign in to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: 0x5BFA

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$env:OUTPUT_DIR\*.nupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "$env:OUTPUT_DIR\*.snupkg" --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
